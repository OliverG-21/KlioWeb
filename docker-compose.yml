services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: klio
      POSTGRES_USER: klio
      POSTGRES_PASSWORD: kliodev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ffmpeg-service:
    build: ./ffmpeg-service
    ports:
      - "5100:5100"
    volumes:
      - ${STORAGE_PATH:-/Users/oliver/Documents/Klio-Data}:/storage
    restart: unless-stopped

volumes:
  postgres_data:
